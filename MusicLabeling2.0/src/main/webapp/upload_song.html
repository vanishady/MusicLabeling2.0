<!DOCTYPE html>
<html>
<head>
    <title>Upload Song</title>
    <script src="scripts/utils.js" charset="utf-8" defer></script>
    <script src="scripts/uploadSong.js" charset="utf-8" defer></script>
    <link rel="shortcut icon"
          href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" media="all"
          href="css/index.css"/>

</head>
<body>
<h2>Upload a New Song</h2>
<div class="top">
    <div class="img-container">
        <img class="logo" src="images/lwt3_logo.png" alt="Couldn't Load Logo">
    </div>
    <div id="songs-table-link">
        <a href="songs_table.html">Go Back</a>
    </div>
</div>
<div class="center-absolute">
    <div class="container-index">
        <form id="upload-song-form" class="upload-song">
            <fieldset class="index">
                <div id="user-selector-container" class="custom-select">
                    <select id="user-selector" class="song-labels" name="userId">

                    </select>
                </div>
                <p><input class="index" id="song-name" type="text" name="songName" placeholder="Song Name"></p>
                <p><input class="index" id="artist" type="text" name="artist" placeholder="Artist"></p>
                <input id="file" type="file" name="songFile" />
                <button class="index" id="upload-song-button" type="submit">Upload</button>
                <p id="alert-container"></p>
            </fieldset>
        </form>
    </div>
</div>
</body>
</html>
